<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlucoScanner Data</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f4ee;
      color: #202322;
    }

    main {
      width: min(640px, calc(100% - 40px));
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
    }

    p {
      margin: 0 0 24px;
      max-width: 54ch;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid #c9c4b8;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: #fffdf8;
    }

    a:hover {
      border-color: #487a67;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>GlucoScanner Data</h1>
    <p>Static update files for the GlucoScanner sweetener database.</p>
    <ul>
      <li><a href="./version.json"><code>version.json</code></a></li>
      <li><a href="./sweetener-data.json"><code>sweetener-data.json</code></a></li>
    </ul>
  </main>
</body>
</html>
